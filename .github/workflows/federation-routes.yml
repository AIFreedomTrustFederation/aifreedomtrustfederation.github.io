name: Federation Route Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: federation-routes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify federation manifests and routes
        run: .aift/commands/verify.sh

      - name: Confirm verification is non-mutating
        run: git diff --exit-code && test -z "$(git status --porcelain)"
